# Single-agent reference: one solver, no team.
name: baseline
seed: 42
workers: 8

llm:
  base_url: http://localhost:11434/v1
  model: qwen2.5:1.5b-instruct-fp16
  temperature: 0.7
  max_tokens: 768

experiments:
  - topology: single                 # sampled, same settings as the team solvers
  - topology: single
    temperature: 0.0                 # greedy, for reference
